<body>
    <h1>Condition </h1>
    <script>
        let gage =1;
        let bage =21;
        if (gage==18){
            document.write("girl eligible")
        }else if(bage==21){
            document.write("boys eligible")
        }else{
            document.write("gg")
        }

        let day=Number(prompt("enter"));
        switch(day){
            case 1:
                document.write("sunday")
                break;
        }
        switch(day){
            case 2:
                document.write("MON")
                break;
        }
        switch(day){
            case 3:
                document.write("wed")
                break;
        }
        switch(day){
            case 4:
                document.write("thur")
                break;
        }
        switch(day){
            case 5:
                document.write("fri")
                break;
        }
        switch(day){
            case 6:
                document.write("Sat ")
                break;
        }
        switch(day){
            default:
                document.write("correct")
        }

    </script>
