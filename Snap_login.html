
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Snapchat Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: Arial, sans-serif;
			background: #fffc00;
		}
		.login-card {
			width: min(90%, 380px);
			padding: 35px;
			text-align: center;
			background: #fff;
			border-radius: 14px;
			box-shadow: 0 8px 25px rgba(0, 0, 0, .18);
		}
		.logo {
			width: 70px;
			height: 70px;
			margin: 0 auto 15px;
			display: grid;
			place-items: center;
			border: 3px solid #111;
			border-radius: 50%;
			background: #fffc00;
			font-size: 38px;
		}
		h1 { margin: 0 0 25px; color: #111; }
		input {
			width: 100%;
			margin-bottom: 15px;
			padding: 13px;
			border: 1px solid #ccc;
			border-radius: 6px;
			font-size: 15px;
		}
		button {
			width: 100%;
			padding: 13px;
			border: 0;
			border-radius: 6px;
			background: #111;
			color: #fff;
			font-size: 16px;
			cursor: pointer;
		}
		button:hover { background: #333; }
		a { color: #111; font-size: 14px; }
		.signup { margin-top: 20px; }
	</style>
</head>
<body>
	<main class="login-card">
		<div class="logo" aria-label="Snapchat logo">👻</div>
		<h1>Log In to Snapchat</h1>
		<form>
			<input type="text" placeholder="Username or email" required>
			<input type="password" placeholder="Password" required>
			<button type="submit">Log In</button>
		</form>
		<p><a href="#">Forgot your password?</a></p>
		<p class="signup">New to Snapchat? <a href="#">Sign up</a></p>
	</main>
</body>
</html>
