
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Instagram Login</title>
	<style>
		body {
			margin: 0;
			background: #fafafa;
			font-family: Arial, sans-serif;
			color: #262626;
		}
		.login-box {
			width: 350px;
			margin: 50px auto;
			padding: 40px;
			text-align: center;
			background: #fff;
			border: 1px solid #dbdbdb;
		}
		.logo { font-size: 42px; margin: 0 0 30px; }
		input {
			width: 100%;
			margin-bottom: 8px;
			padding: 10px;
			border: 1px solid #dbdbdb;
			border-radius: 3px;
			background: #fafafa;
		}
		button {
			width: 100%;
			margin-top: 10px;
			padding: 9px;
			border: 0;
			border-radius: 6px;
			background: #0095f6;
			color: white;
			font-weight: bold;
			cursor: pointer;
		}
		.divider { margin: 25px 0; color: #737373; font-size: 13px; }
		a { color: #00376b; text-decoration: none; font-size: 13px; }
		.signup { margin-top: 25px; font-size: 14px; }
		.signup a { color: #0095f6; font-weight: bold; }
		.meta {
			margin-top: 30px;
			text-align: center;
			color: #737373;
			font-size: 13px;
		}
		.meta-logo {
			display: inline-block;
			margin-top: 8px;
			color: #0866ff;
			font-size: 24px;
			font-weight: bold;
			letter-spacing: -1px;
		}
	</style>
</head>
<body>
	<main class="login-box">
		<h1 class="logo">Instagram</h1>
		<form>
			<input type="text" placeholder="Phone number, username, or email" required>
			<input type="password" placeholder="Password" required>
			<button type="submit">Log in</button>
		</form>
		<p class="divider">OR</p>
		<a href="#">Log in with Facebook</a>
		<p><a href="#">Forgot password?</a></p>
		<p class="signup">Don't have an account? <a href="#">Sign up</a></p>
		<div class="meta">
			<span class="meta-logo" aria-hidden="true">∞</span>
			<span>Meta</span>
		</div>
	</main>
</body>
</html>
