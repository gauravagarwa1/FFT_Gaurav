<html>
    <head>
        <title>CSS Grid</title>
        <style>
            .parent{
                width: 100%;
                background: yellow;
            }
            div{
                background: red;
                margin:5px;
                display:grid;
                grid-template-columns: 10% 20% 30% 5% 30%;
            }
        </style>
    </head>
    <body>
        <h1>Css Grid</h1>
        <div class ="parent">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>

        </div>
    </body>
</html>
