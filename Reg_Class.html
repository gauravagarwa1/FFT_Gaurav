
<html>

        label {
            padding-left: 180px;
        }

        #i1 {
            width: 300px;

        }

        #i2 {
            width: 300px;
            margin-left: 85px;
            height: 30px;
        }

        #i3 {
            width: 300px;
            margin-left: 50px;
            height: 30px;
        }

        #i4 {
            width: 300px;
            margin-left: 47px;
            height: 30px;
        }

        #i5 {
            width: 300px;
            margin-left: 65px;
            height: 30px;
        }

        #i6 {
            width: 300px;
            margin-left: 98px;
            height: 30px;
        }

        #i7 {
            width: 300px;
            margin-left: 122px;
            height: 30px;
        }

        #i8 {
            width: 300px;
            margin-left: 77px;
            height: 30px;
        }

        #i9 {
            width: 300px;
            margin-left: 107px;

        #i10 {

        }

<body>

    <form>
        <h1 style="text-align: center;">Student Registration Form</h1>

        <label>Registration ID :</label>
        <input type="number" id="i1"><br><br>

        <label>Full Name :</label>
        <input type="text" id="i2"><br><br>

        <label>E-mail Address :</label>
        <input type="email" id="i3"><br><br>

        <label>Mobile Number :</label>
        <input type="tel" id="i4"><br><br>

        <label>Date of Birth :</label>
        <input type="date" id="i5"><br><br>

        <label>Gender :</label>
        Male <input type="radio" name="Gender">
        Female <input type="radio" name="Gender">
        Others <input type="radio" name="Gender">
        <br><br>

        <label>Address :</label>
        <input type="text" id="i6"><br><br>

        <label>City :</label>
        <input type="text" id="i7"><br><br>

        <label>Department :</label>
        <input type="text" id="i8"><br><br>

        <label>Course :</label>
        <input type="text" id="i9"><br><br>

        <label>Password :</label>
        <input type="password" id="i10"><br><br>

        <label>Resume :</label>
        <input type="file" id="i11"><br><br>

        <label></label>
        <input type="submit" id="i12">
        <input type="reset" id="i13">

    </form>

</body>
